name: CI Quick

on:
  push:
    branches-ignore: [main]

concurrency:
  group: quick-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    name: Quick
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      # check includes product builds; the fast behavioral check needs no browser or DB.
      - run: npm run check
      - run: npm run test:domain
