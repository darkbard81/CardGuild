<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="CardGuild development environment for PixiJS and DOM UI"
    />
    <title>CardGuild</title>
  </head>
  <body>
    <main id="app" class="app-shell">
      <section class="battlefield-shell" aria-labelledby="battlefield-title">
        <header class="shell-heading">
          <p class="eyebrow">PixiJS renderer</p>
          <h1 id="battlefield-title">CardGuild Battlefield</h1>
        </header>
        <div
          id="pixi-root"
          class="pixi-root"
          data-ready="false"
          aria-label="PixiJS battlefield canvas container"
        ></div>
      </section>

      <aside class="dom-shell" aria-labelledby="dom-title">
        <p class="eyebrow">DOM interface</p>
        <h2 id="dom-title">Development shell</h2>
        <p>
          전장 렌더러와 정보 UI가 분리된 상태로 초기화되었습니다. 게임 규칙과
          콘텐츠는 아직 포함하지 않습니다.
        </p>
        <dl class="runtime-status">
          <div>
            <dt>PixiJS</dt>
            <dd id="pixi-status" role="status" aria-live="polite">Starting…</dd>
          </div>
          <div>
            <dt>DOM</dt>
            <dd>Ready</dd>
          </div>
        </dl>
      </aside>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
