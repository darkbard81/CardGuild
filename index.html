<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1024" />
    <meta
      name="description"
      content="CardGuild deterministic PF2e tactical combat vertical slice"
    />
    <title>CardGuild — Goblin Trouble</title>
  </head>
  <body>
    <main
      id="app"
      class="app-shell"
      data-ready="false"
      data-outcome="ongoing"
      data-state-hash=""
    >
      <section id="adventure-screen" class="adventure-screen" aria-labelledby="adventure-title">
        <div class="adventure-map-card">
          <p class="eyebrow">PF2e Tactical Adventure</p>
          <h2 id="adventure-title">Adventure Progress</h2>
          <ol id="adventure-progress" class="adventure-progress"></ol>
          <div id="adventure-collection" class="adventure-collection"></div>
        </div>
        <article id="adventure-content" class="adventure-content"></article>
      </section>

      <section class="combat-stage combat-only" aria-label="Tactical combat">
        <div
          id="pixi-root"
          class="pixi-root"
          data-ready="false"
          aria-label="CardGuild top-down perspective tactical battlefield"
        ></div>
        <div id="ring-root" class="ring-root" hidden></div>
        <span id="pixi-status" class="sr-only" role="status" aria-live="polite">Starting…</span>

        <div class="combat-hud">
          <section class="hud-card hero-card" aria-labelledby="hero-heading">
            <div class="hero-id">
              <h2 id="hero-heading">Aerin</h2>
              <div id="action-pips" class="action-pips" aria-label="Actions remaining"></div>
            </div>
            <div id="hero-stats" class="actor-stats"></div>
          </section>

          <div class="hud-status">
            <p class="hud-card objective-card">
              <span class="hud-label">Objective</span>
              <strong id="objective-text">Loading encounter…</strong>
            </p>
            <div class="hud-card initiative-card">
              <p class="round-chip">
                <span class="hud-label">Round</span>
                <strong id="round-value">1</strong>
              </p>
              <ol id="initiative-list" class="initiative-list" aria-label="Initiative order"></ol>
            </div>
          </div>

          <aside class="hud-side" aria-label="Combat details">
            <section class="hud-card inspector">
              <h2 class="hud-label">Detail</h2>
              <div id="selected-detail" class="selected-detail"></div>
            </section>
            <section class="hud-card log-panel">
              <h2 class="hud-label">Combat Log</h2>
              <ol id="combat-log" class="combat-log" aria-live="polite"></ol>
            </section>
          </aside>

          <p id="board-prompt" class="board-prompt" aria-live="polite">행동을 선택하세요.</p>

          <footer class="hand-dock">
            <div id="hand-cards" class="hand-cards"></div>
            <div class="hand-side">
              <p class="pile-counts">
                <span>Hand <strong id="hand-count">0</strong></span>
                <span>Deck <strong id="deck-count">0</strong></span>
                <span>Discard <strong id="discard-count">0</strong></span>
              </p>
              <button id="end-turn" class="end-turn-button" type="button">End Turn</button>
            </div>
          </footer>
        </div>
      </section>

      <div id="reaction-modal" class="modal-backdrop" hidden>
        <section class="modal-card" role="dialog" aria-modal="true" aria-labelledby="reaction-title">
          <p class="eyebrow">Reaction window</p>
          <h2 id="reaction-title">Reactive Strike?</h2>
          <p id="reaction-description"></p>
          <div class="modal-actions">
            <button id="reaction-pass" class="secondary-button" type="button">Pass</button>
            <button id="reaction-use" class="primary-button" type="button">Use Reaction</button>
          </div>
        </section>
      </div>

      <div id="result-modal" class="modal-backdrop" hidden>
        <section class="modal-card result-card" role="dialog" aria-modal="true" aria-labelledby="result-title">
          <p class="eyebrow">Encounter complete</p>
          <h2 id="result-title">Victory</h2>
          <p id="result-description"></p>
          <button id="restart-battle" class="primary-button" type="button">Replay Same Seed</button>
        </section>
      </div>
    </main>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
